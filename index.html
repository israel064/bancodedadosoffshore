<meta charset="UTF-8">

<style>
:root{
  --nd:#0A1B33;--nm:#122A4D;--nc:#16335C;
  --go:#D4A537;--gs:#E8C468;--ow:#F6F3EA;
  --tm:#8FA0BD;--td:#5E7196;
  --ok:#5FAE8D;--wr:#E0B450;--er:#D17068;
  --br:rgba(212,165,55,0.18);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--nd);font-family:'Poppins',sans-serif;color:var(--ow);min-height:100vh;padding-bottom:80px;}

/* HEADER */
.hdr{padding:22px 18px 14px;text-align:center;background:linear-gradient(180deg,rgba(22,51,92,0.6),transparent);}
.hdr-eye{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--go);font-weight:600;}
.hdr-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--ow);margin-top:3px;}
.hdr-sub{font-size:11.5px;color:var(--tm);margin-top:4px;}
.hdr-stats{display:flex;justify-content:center;gap:18px;margin-top:10px;}
.hdr-stat{text-align:center;}
.hdr-stat-n{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gs);}
.hdr-stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--td);}
.hz{height:1px;background:linear-gradient(90deg,transparent,var(--go) 50%,transparent);margin:0 18px;opacity:.4;}

/* RECENTLY COPIED */
.rc-wrap{padding:12px 18px 0;}
.rc-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--td);font-weight:600;margin-bottom:7px;}
.rc-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.rc-row::-webkit-scrollbar{display:none;}
.rc-chip{flex-shrink:0;background:var(--nm);border:1px solid var(--br);border-radius:20px;padding:5px 11px;font-size:11px;color:var(--tm);cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc-chip:active{background:var(--nc);}

/* SEARCH */
.sw{padding:10px 18px 0;}
.si{width:100%;background:var(--nm);border:1px solid var(--br);color:var(--ow);font-family:'Poppins',sans-serif;font-size:13px;padding:9px 14px;border-radius:9px;outline:none;}
.si:focus{border-color:var(--go);}
.si::placeholder{color:var(--td);}

/* TABS */
.tabs{display:flex;overflow-x:auto;gap:0;padding:12px 18px 0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:7px 13px;font-size:11px;font-weight:600;color:var(--td);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.tab.active{color:var(--gs);border-color:var(--go);}

/* SECTION */
.sec{display:none;padding:14px 18px 0;}
.sec.active{display:block;}
.sec-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ow);margin-bottom:8px;}
.tip{background:rgba(212,165,55,0.07);border-left:3px solid var(--go);border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:10px;font-size:11px;color:var(--tm);line-height:1.5;}

/* GROUP HEADER */
.ghdr{background:linear-gradient(135deg,var(--nc),var(--nm));border:1px solid var(--br);border-left:3px solid var(--go);border-radius:10px;padding:11px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ghdr-info .gtitle{font-family:'Playfair Display',serif;font-size:14.5px;font-weight:700;color:var(--ow);}
.ghdr-info .gsub{font-size:11px;color:var(--gs);margin-top:1px;}
.ghdr-info .gmeta{font-size:10.5px;color:var(--tm);margin-top:1px;}
.ghdr-actions{display:flex;gap:5px;flex-shrink:0;}

/* FIELD CARD */
.fcard{background:var(--nm);border:1px solid var(--br);border-radius:10px;padding:11px 12px;margin-bottom:7px;}
.fcard.pinned{border-color:rgba(212,165,55,0.5);background:rgba(18,42,77,0.95);}
.fcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.fcard-left{flex:1;min-width:0;}
.flabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--td);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.pin-star{color:var(--go);font-size:10px;}
.fval{font-size:12.5px;color:var(--ow);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.fcard-btns{display:flex;gap:5px;margin-top:9px;align-items:center;}
.cbtn{flex:1;background:rgba(212,165,55,0.13);border:1px solid rgba(212,165,55,0.28);color:var(--gs);font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;padding:6px 0;border-radius:7px;cursor:pointer;text-align:center;}
.cbtn.copied{background:rgba(95,174,141,0.18);border-color:rgba(95,174,141,0.4);color:var(--ok);}
.fchars{font-size:10px;color:var(--td);align-self:center;}

/* MENU BUTTON */
.mbtn{background:rgba(255,255,255,0.05);border:1px solid var(--br);color:var(--tm);font-size:15px;padding:4px 8px;border-radius:7px;cursor:pointer;line-height:1;flex-shrink:0;}
.mbtn:active{background:rgba(255,255,255,0.1);}

/* INLINE MENU */
.imenu{display:none;flex-direction:column;gap:5px;margin-top:7px;padding-top:7px;border-top:1px solid var(--br);}
.imenu.open{display:flex;}
.imenu-row{display:flex;gap:5px;}
.ibtn{flex:1;padding:6px 0;border-radius:7px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;border:1px solid var(--br);cursor:pointer;text-align:center;}
.ibtn-edit{background:rgba(143,160,189,0.12);color:var(--tm);}
.ibtn-pin{background:rgba(212,165,55,0.12);color:var(--go);}
.ibtn-del{background:rgba(209,112,104,0.12);color:var(--er);}
.ibtn-copy-all{background:rgba(95,174,141,0.12);color:var(--ok);}

/* ADD BUTTONS */
.add-field-btn{width:100%;padding:8px 0;border-radius:9px;border:1px dashed rgba(212,165,55,0.35);background:transparent;color:var(--td);font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;margin-bottom:7px;}
.add-group-btn{width:100%;padding:9px 0;border-radius:9px;border:1px dashed rgba(212,165,55,0.35);background:transparent;color:var(--go);font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;margin-top:4px;margin-bottom:7px;}

/* FAB */
.fab-row{position:fixed;bottom:20px;right:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:40;}
.fab{width:48px;height:48px;border-radius:50%;background:var(--go);color:var(--nd);font-size:22px;font-weight:700;border:none;box-shadow:0 5px 18px rgba(212,165,55,0.38);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fab-sm{width:38px;height:38px;font-size:16px;background:var(--nm);color:var(--gs);border:1px solid var(--br);box-shadow:0 3px 12px rgba(0,0,0,0.3);}

/* OVERLAY / SHEET */
.ov{position:fixed;inset:0;background:rgba(5,12,24,0.8);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.ov.open{display:flex;}
.sheet{background:var(--nm);border-radius:18px 18px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 18px 28px;border-top:1px solid var(--br);}
.sh-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--ow);margin-bottom:14px;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--td);margin-bottom:5px;font-weight:600;}
.fld input,.fld textarea,.fld select{width:100%;background:var(--nd);border:1px solid var(--br);color:var(--ow);font-family:'Poppins',sans-serif;font-size:13.5px;padding:10px 12px;border-radius:8px;outline:none;}
.fld input:focus,.fld textarea:focus{border-color:var(--go);}
.fld textarea{resize:vertical;min-height:80px;}
.sh-actions{display:flex;gap:8px;margin-top:14px;}
.sbtn{flex:1;padding:12px 0;border-radius:9px;font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600;border:none;cursor:pointer;}
.sbtn-p{background:var(--go);color:var(--nd);}
.sbtn-g{background:transparent;border:1px solid var(--br);color:var(--tm);}
.sbtn-d{background:rgba(209,112,104,0.15);border:1px solid rgba(209,112,104,0.3);color:var(--er);}

/* CONFIRM */
.conf{background:var(--nd);border:1px solid rgba(209,112,104,0.3);border-radius:10px;padding:14px;margin-top:10px;display:none;}
.conf.open{display:block;}
.conf p{font-size:13px;color:var(--tm);margin-bottom:10px;line-height:1.4;}

/* EMPTY */
.empty{text-align:center;padding:30px 20px;color:var(--td);}
.empty-t{font-family:'Playfair Display',serif;font-size:15px;color:var(--tm);margin-bottom:5px;}
.empty-s{font-size:11.5px;}

/* RESET BANNER */
.reset-wrap{padding:0 18px;margin-top:10px;}
.reset-btn{width:100%;padding:8px 0;border-radius:8px;border:1px solid rgba(209,112,104,0.2);background:transparent;color:rgba(209,112,104,0.6);font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;cursor:pointer;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--go);color:var(--nd);font-size:12.5px;font-weight:600;padding:8px 18px;border-radius:25px;opacity:0;transition:all .22s ease;pointer-events:none;z-index:60;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* SEARCH RESULT */
.search-active .fcard{display:none;}
.search-active .fcard.match{display:block;}
.search-active .ghdr{display:none;}
.search-active .ghdr.match{display:block;}
</style>
</head>

let data = null;
let recentlyCopied = [];
let copiesToday = 0;
let todayKey = new Date().toDateString();

// ─────────────────────────────────────────────
//  STORAGE
// ─────────────────────────────────────────────
async function loadData(){
  try{
    const r = await window.storage.get('curric-data-v2');
    data = r ? JSON.parse(r.value) : deepClone(DEF);
  }catch(e){ data = deepClone(DEF); }
  try{
    const r2 = await window.storage.get('curric-rc');
    recentlyCopied = r2 ? JSON.parse(r2.value) : [];
  }catch(e){ recentlyCopied=[]; }
  try{
    const r3 = await window.storage.get('curric-copies');
    const c = r3 ? JSON.parse(r3.value) : {};
    copiesToday = (c.date===todayKey) ? c.count : 0;
  }catch(e){ copiesToday=0; }
}
async function saveData(){ try{ await window.storage.set('curric-data-v2', JSON.stringify(data)); }catch(e){} }
async function saveRC(){ try{ await window.storage.set('curric-rc', JSON.stringify(recentlyCopied)); }catch(e){} }
async function saveCopies(){ try{ await window.storage.set('curric-copies', JSON.stringify({date:todayKey,count:copiesToday})); }catch(e){} }

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return '_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

// ─────────────────────────────────────────────
//  FIND HELPERS
// ─────────────────────────────────────────────
function findSec(id){ return data.sections.find(s=>s.id===id); }
function findField(secId, fieldId, groupId){
  const sec=findSec(secId);
  if(!sec) return null;
  if(sec.type==='flat') return sec.fields.find(f=>f.id===fieldId);
  if(groupId){
    const g=sec.groups.find(g=>g.id===groupId);
    return g ? g.fields.find(f=>f.id===fieldId) : null;
  }
  return null;
}
function getAllPinnedFields(){
  let pins=[];
  data.sections.forEach(s=>{
    if(s.id==='fav') return;
    if(s.type==='flat') s.fields.filter(f=>f.pinned).forEach(f=>pins.push({...f,_sec:s.id}));
    if(s.type==='grouped') s.groups.forEach(g=>g.fields.filter(f=>f.pinned).forEach(f=>pins.push({...f,_sec:s.id,_grp:g.id})));
  });
  return pins;
}
function countAllFields(){
  let n=0;
  data.sections.forEach(s=>{
    if(s.id==='fav') return;
    if(s.type==='flat') n+=s.fields.length;
    if(s.type==='grouped') s.groups.forEach(g=>n+=g.fields.length);
  });
  return n;
}

//  RENDER

function renderAll(){
  renderTabs();
  renderSections();
  renderStats();
  renderRC();
}

function renderTabs(){
  const bar=document.getElementById('tabBar');
  bar.innerHTML = data.sections.map((s,i)=>`
    <div class="tab${i===0?'  active':''}" data-tab="${s.id}">${s.title}</div>
  `).join('');
  bar.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      bar.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));
      document.getElementById('sec-'+t.dataset.tab)?.classList.add('active');
      closeAllMenus();
    });
  });
}

function renderSections(){
  const wrap=document.getElementById('sections');
  wrap.innerHTML = data.sections.map((s,i)=>{
    let inner='';
    if(s.id==='fav'){
      const pins=getAllPinnedFields();
      if(pins.length===0) inner=`<div class="empty"><div class="empty-t">Nenhum favorito ainda</div><div class="empty-s">Toque em ⋯ em qualquer campo e escolha "Favorito".</div></div>`;
      else inner=pins.map(f=>fieldCard(f,{secId:f._sec,groupId:f._grp,fromFav:true})).join('');
    } else if(s.type==='flat'){
      inner = s.fields.map(f=>fieldCard(f,{secId:s.id})).join('');
      inner += `<button class="add-field-btn" data-action="add-field" data-sec="${s.id}">+ Adicionar campo</button>`;
    } else if(s.type==='grouped'){
      inner = s.groups.map(g=>{
        let ghtml=`<div class="ghdr" data-gid="${g.id}">
          <div class="ghdr-info">
            <div class="gtitle">${esc(g.title)}</div>
            ${g.subtitle?`<div class="gsub">${esc(g.subtitle)}</div>`:''}
            ${g.meta?`<div class="gmeta">${esc(g.meta)}</div>`:''}
          </div>
          <div class="ghdr-actions">
            <button class="mbtn" data-action="copy-group" data-sec="${s.id}" data-grp="${g.id}" title="Copiar tudo">⎘</button>
            <button class="mbtn" data-action="menu-group" data-sec="${s.id}" data-grp="${g.id}">⋯</button>
          </div>
        </div>
        <div class="imenu" id="gmenu-${g.id}">
          <div class="imenu-row">
            <button class="ibtn ibtn-edit" data-action="edit-group" data-sec="${s.id}" data-grp="${g.id}">Editar título</button>
            <button class="ibtn ibtn-edit" data-action="add-field" data-sec="${s.id}" data-grp="${g.id}">+ Campo</button>
          </div>
          <div class="imenu-row">
            <button class="ibtn ibtn-del" data-action="del-group" data-sec="${s.id}" data-grp="${g.id}">Excluir grupo</button>
          </div>
        </div>`;
        ghtml += g.fields.map(f=>fieldCard(f,{secId:s.id,groupId:g.id})).join('');
        return ghtml;
      }).join('<div style="height:8px"></div>');
      const gt = s.id==='certs'?'Certificação':s.id==='form'?'Formação':'Empresa';
      inner += `<button class="add-group-btn" data-action="add-group" data-sec="${s.id}">+ Adicionar ${gt}</button>`;
    }
    return `<div class="sec${i===0?' active':''}" id="sec-${s.id}">
      <div style="height:14px"></div>
      ${s.tip?`<div class="tip">${esc(s.tip)}</div>`:''}
      ${inner}
    </div>`;
  }).join('');

  // delegate all actions
  wrap.addEventListener('click', handleAction);
}

function fieldCard(f, ctx){
  const chars = f.value ? f.value.length : 0;
  const menuId = `fmenu-${f.id}${ctx.fromFav?'-fav':''}`;
  return `<div class="fcard${f.pinned?' pinned':''}" id="fc-${f.id}${ctx.fromFav?'-fav':''}">
    <div class="fcard-top">
      <div class="fcard-left">
        <div class="flabel">${f.pinned?'<span class="pin-star">⭐</span>':''}${esc(f.label)}</div>
        <div class="fval">${esc(f.value)}</div>
      </div>
      <button class="mbtn" data-action="menu-field" data-sec="${ctx.secId}" data-grp="${ctx.groupId||''}" data-fid="${f.id}" data-menuid="${menuId}">⋯</button>
    </div>
    <div class="fcard-btns">
      <button class="cbtn" data-action="copy" data-value="${encodeURIComponent(f.value)}" data-label="${encodeURIComponent(f.label)}">Copiar</button>
      <span class="fchars">${chars} car.</span>
    </div>
    <div class="imenu" id="${menuId}">
      <div class="imenu-row">
        <button class="ibtn ibtn-edit" data-action="edit-field" data-sec="${ctx.secId}" data-grp="${ctx.groupId||''}" data-fid="${f.id}">Editar</button>
        <button class="ibtn ibtn-pin" data-action="pin-field" data-sec="${ctx.secId}" data-grp="${ctx.groupId||''}" data-fid="${f.id}">${f.pinned?'★ Desfavoritar':'☆ Favoritar'}</button>
      </div>
      <div class="imenu-row">
        <button class="ibtn ibtn-del" data-action="del-field" data-sec="${ctx.secId}" data-grp="${ctx.groupId||''}" data-fid="${f.id}">Excluir</button>
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────
//  HANDLE ACTIONS
// ─────────────────────────────────────────────
function handleAction(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const a=btn.dataset.action, sec=btn.dataset.sec, grp=btn.dataset.grp||null, fid=btn.dataset.fid;

  if(a==='copy'){
    doCopy(decodeURIComponent(btn.dataset.value), decodeURIComponent(btn.dataset.label), btn);
    return;
  }
  if(a==='menu-field'){
    const mid=btn.dataset.menuid;
    const menu=document.getElementById(mid);
    if(!menu) return;
    const wasOpen=menu.classList.contains('open');
    closeAllMenus();
    if(!wasOpen) menu.classList.add('open');
    return;
  }
  if(a==='menu-group'){
    const mid=`gmenu-${grp}`;
    const menu=document.getElementById(mid);
    if(!menu) return;
    const wasOpen=menu.classList.contains('open');
    closeAllMenus();
    if(!wasOpen) menu.classList.add('open');
    return;
  }
  if(a==='copy-group'){
    const s=findSec(sec);
    const g=s?.groups?.find(x=>x.id===grp);
    if(!g) return;
    const text=[`${g.title}${g.subtitle?' — '+g.subtitle:''}${g.meta?' ('+g.meta+')':''}`,...g.fields.map(f=>`${f.label}: ${f.value}`)].join('\n');
    doCopy(text,g.title+' (completo)',btn);
    return;
  }
  closeAllMenus();

  if(a==='edit-field') openEditField(sec,grp,fid);
  else if(a==='del-field') openDelField(sec,grp,fid);
  else if(a==='pin-field') doPin(sec,grp,fid);
  else if(a==='add-field') openAddField(sec,grp);
  else if(a==='edit-group') openEditGroup(sec,grp);
  else if(a==='del-group') openDelGroup(sec,grp);
  else if(a==='add-group') openAddGroup(sec);
}

function closeAllMenus(){
  document.querySelectorAll('.imenu.open').forEach(m=>m.classList.remove('open'));
}

// ─────────────────────────────────────────────
//  COPY
// ─────────────────────────────────────────────
async function doCopy(text, label, btn){
  try{ await navigator.clipboard.writeText(text); } catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  if(btn){ btn.textContent='✓ Copiado!'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('copied');},1800); }
  showToast(`Copiado — ${text.length} caracteres`);
  copiesToday++;
  recentlyCopied.unshift({label,value:text});
  if(recentlyCopied.length>5) recentlyCopied.pop();
  renderRC(); renderStats();
  await saveCopies(); await saveRC();
}

// ─────────────────────────────────────────────
//  PIN
// ─────────────────────────────────────────────
async function doPin(secId,groupId,fieldId){
  const f=findField(secId,fieldId,groupId);
  if(!f) return;
  f.pinned=!f.pinned;
  await saveData();
  renderAll();
  showToast(f.pinned?'Adicionado aos favoritos':'Removido dos favoritos');
}

// ─────────────────────────────────────────────
//  MODAL HELPERS
// ─────────────────────────────────────────────
function openOverlay(){ document.getElementById('overlay').classList.add('open'); document.getElementById('conf').classList.remove('open'); }
function closeOverlay(){ document.getElementById('overlay').classList.remove('open'); }

function setModal(title, bodyHtml, actions){
  document.getElementById('shTitle').textContent=title;
  document.getElementById('shBody').innerHTML=bodyHtml;
  document.getElementById('shActions').innerHTML=actions;
  openOverlay();
}

// ─────────────────────────────────────────────
//  EDIT FIELD
// ─────────────────────────────────────────────
function openEditField(secId,groupId,fieldId){
  const f=findField(secId,fieldId,groupId);
  if(!f) return;
  shContext={secId,groupId,fieldId};shMode='edit-field';
  setModal('Editar campo',
    `<div class="fld"><label>Nome do campo</label><input id="sh_label" value="${esc(f.label)}"></div>
     <div class="fld"><label>Conteúdo</label><textarea id="sh_value">${esc(f.value)}</textarea></div>`,
    `<button class="sbtn sbtn-g" id="shCancel">Cancelar</button><button class="sbtn sbtn-p" id="shSave">Salvar</button>`
  );
  bindModalBtns(saveEditField);
}
async function saveEditField(){
  const f=findField(shContext.secId,shContext.fieldId,shContext.groupId);
  if(!f) return;
  f.label=document.getElementById('sh_label').value.trim()||f.label;
  f.value=document.getElementById('sh_value').value;
  await saveData(); closeOverlay(); renderAll(); showToast('Campo atualizado');
}

// ─────────────────────────────────────────────
//  DEL FIELD
// ─────────────────────────────────────────────
function openDelField(secId,groupId,fieldId){
  const f=findField(secId,fieldId,groupId);
  if(!f) return;
  shContext={secId,groupId,fieldId};shMode='del-field';
  setModal('Excluir campo','',
    `<button class="sbtn sbtn-g" id="shCancel">Cancelar</button>`
  );
  document.getElementById('confMsg').textContent=`Excluir o campo "${f.label}"? Essa ação não pode ser desfeita.`;
  document.getElementById('conf').classList.add('open');
  document.getElementById('confYes').onclick=doDelField;
  document.getElementById('confNo').onclick=closeOverlay;
  document.getElementById('shCancel').onclick=closeOverlay;
}
async function doDelField(){
  const {secId,groupId,fieldId}=shContext;
  const sec=findSec(secId);
  if(!sec) return;
  if(sec.type==='flat') sec.fields=sec.fields.filter(f=>f.id!==fieldId);
  else{ const g=sec.groups.find(g=>g.id===groupId); if(g) g.fields=g.fields.filter(f=>f.id!==fieldId); }
  await saveData(); closeOverlay(); renderAll(); showToast('Campo excluído');
}

// ─────────────────────────────────────────────
//  ADD FIELD
// ─────────────────────────────────────────────
function openAddField(secId,groupId){
  shContext={secId,groupId};shMode='add-field';
  setModal('Adicionar campo',
    `<div class="fld"><label>Nome do campo</label><input id="sh_label" placeholder="Ex: Cargo PT"></div>
     <div class="fld"><label>Conteúdo</label><textarea id="sh_value" placeholder="Cole o texto aqui..."></textarea></div>`,
    `<button class="sbtn sbtn-g" id="shCancel">Cancelar</button><button class="sbtn sbtn-p" id="shSave">Adicionar</button>`
  );
  bindModalBtns(saveAddField);
}
async function saveAddField(){
  const label=document.getElementById('sh_label').value.trim();
  const value=document.getElementById('sh_value').value;
  if(!label) return;
  const {secId,groupId}=shContext;
  const sec=findSec(secId);
  if(!sec) return;
  const nf={id:uid(),label,value,pinned:false};
  if(sec.type==='flat') sec.fields.push(nf);
  else{ const g=sec.groups.find(g=>g.id===groupId); if(g) g.fields.push(nf); }
  await saveData(); closeOverlay(); renderAll(); showToast('Campo adicionado');
}

// ─────────────────────────────────────────────
//  EDIT GROUP
// ─────────────────────────────────────────────

}
async function saveEditGroup(){
  const sec=findSec(shContext.secId);
  const g=sec?.groups?.find(x=>x.id===shContext.groupId);
  if(!g) return;
  g.title=document.getElementById('sh_gtitle').value.trim()||g.title;

// ─────────────────────────────────────────────
//  DEL GROUP
// ─────────────────────────────────────────────
function openDelGroup(secId,groupId){
  const sec=findSec(secId);
  const g=sec?.groups?.find(x=>x.id===groupId);
  if(!g) return;
  shContext={secId,groupId};shMode='del-group';

  document.getElementById('confNo').onclick=closeOverlay;

async function doDelGroup(){
  const sec=findSec(shContext.secId);
  if(!sec) return;
  sec.groups=sec.groups.filter(g=>g.id!==shContext.groupId);
  await saveData(); closeOverlay(); renderAll(); showToast('Grupo excluído');

// ─────────────────────────────────────────────
//  ADD GROUP
// ─────────────────────────────────────────────
function openAddGroup(secId){
  shContext={secId};shMode='add-group';
  const lbl=secId==='certs'?'certificação':secId==='form'?'formação':'empresa';
  setModal(`Adicionar ${lbl}`,
    `<div class="fld"><label>Título (${lbl})</label><input id="sh_gtitle" placeholder="Ex: Engeman"></div>
     <div class="fld"><label>Subtítulo (cargo/curso)</label><input id="sh_gsub" placeholder="Ex: Auxiliar de Plataforma"></div>
     <div class="fld"><label>Período / detalhes</label><input id="sh_gmeta" placeholder="Ex: Jan/2025 — Atual · Macaé, RJ"></div>`,
    `<button class="sbtn sbtn-g" id="shCancel">Cancelar</button><button class="sbtn sbtn-p" id="shSave">Criar grupo</button>`
  );
  bindModalBtns(saveAddGroup);
}
async function saveAddGroup(){
  const title=document.getElementById('sh_gtitle').value.trim();
  if(!title) return;
  const sec=findSec(shContext.secId);
  if(!sec) return;
  sec.groups.push({id:uid(),title,subtitle:document.getElementById('sh_gsub').value.trim(),meta:document.getElementById('sh_gmeta').value.trim(),fields:[]});
  await saveData(); closeOverlay(); renderAll(); showToast('Grupo criado — adicione campos agora');
}

// ─────────────────────────────────────────────
//  BIND MODAL
// ─────────────────────────────────────────────
function bindModalBtns(saveFn){
  document.getElementById('shCancel').onclick=closeOverlay;
  document.getElementById('shSave').onclick=saveFn;
}

// close on overlay backdrop
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeOverlay(); });

// ─────────────────────────────────────────────
//  STATS + RC
// ─────────────────────────────────────────────
function renderStats(){
  document.getElementById('statFields').textContent=countAllFields();
  document.getElementById('statPinned').textContent=getAllPinnedFields().length;
  document.getElementById('statCopies').textContent=copiesToday;
}
function renderRC(){
  const wrap=document.getElementById('rcWrap');
  const row=document.getElementById('rcRow');
  if(recentlyCopied.length===0){wrap.style.display='none';return;}
  wrap.style.display='block';
  row.innerHTML=recentlyCopied.map((r,i)=>`
    <div class="rc-chip" data-rc="${i}" title="${esc(r.label)}">${esc(r.label)}</div>
  `).join('');
  row.querySelectorAll('.rc-chip').forEach(c=>{
    c.addEventListener('click',()=>{
      const rc=recentlyCopied[+c.dataset.rc];
      if(rc) doCopy(rc.value,rc.label,null);
    });
  });
}

// ─────────────────────────────────────────────
//  SEARCH
// ─────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function(){
  const q=this.value.toLowerCase().trim();
  const secs=document.getElementById('sections');
  if(!q){ secs.classList.remove('search-active'); document.querySelectorAll('.fcard,.ghdr').forEach(e=>e.classList.remove('match')); return; }
  secs.classList.add('search-active');
  document.querySelectorAll('.fcard').forEach(c=>{
    c.classList.toggle('match', c.textContent.toLowerCase().includes(q));
  });
  document.querySelectorAll('.ghdr').forEach(c=>{
    c.classList.toggle('match', c.textContent.toLowerCase().includes(q));
  });
  // show all section tabs
  document.querySelectorAll('.sec').forEach(s=>s.style.display='block');
});

// ─────────────────────────────────────────────
//  RESET
// ─────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', async()=>{
  if(!confirm('Restaurar todos os dados originais? Suas edições serão perdidas.')) return;
  data=deepClone(DEF);
  await saveData();
  renderAll();
  showToast('Dados restaurados');
});

// ─────────────────────────────────────────────
//  TOAST
// ─────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
(async()=>{
  await loadData();
  renderAll();
})();
</script>
